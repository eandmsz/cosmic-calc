[workspace]
members = ["core"]

[package]
name = "cosmic-calc"
version = "0.1.0"
edition = "2021"
description = "A scientific calculator for the COSMIC desktop"
license = "GPL-3.0-only"

[dependencies]
cosmic-calc-core = { path = "core" }
fontdb = "0.23"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# Pinned so `cargo update` cannot silently move us onto a new upstream
# HEAD. Bump deliberately, after testing against the new revision.
rev = "17291536a10124a053b40c49bb459d7b5085331b"
default-features = false
features = ["winit", "tokio", "wgpu"]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[lib]
name = "cosmic_calc"
path = "src/lib.rs"

[[bin]]
name = "cosmic-calc"
path = "src/main.rs"
