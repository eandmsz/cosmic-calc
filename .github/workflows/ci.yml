name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The calculation core has no GUI dependencies, so it builds in
  # seconds and gives fast feedback on the part of the codebase where
  # the arithmetic lives.
  core:
    name: core (engine, config, formatter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - run: cargo fmt --package cosmic-calc-core --check
      - run: cargo clippy --package cosmic-calc-core --all-targets
      - run: cargo test --package cosmic-calc-core

  # The full workspace, including the libcosmic UI. Slower and needs
  # the system libraries libcosmic links against.
  app:
    name: workspace (with UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: app
      - name: Install libcosmic build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxkbcommon-dev libwayland-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
